# ワークフローの名前
name: Pull Request Build Check

# ワークフローがトリガーされるイベント
on:
  # プルリクエストが開かれたとき、同期されたとき、または再オープンされたときにトリガー
  pull_request:
    # どのブランチに対してプルリクエストが出されたときに実行するか
    branches:
      - develop

# ワークフローで実行されるジョブ
jobs:
  # ビルドチェックのジョブ
  build:
    # ジョブが実行されるVM環境
    runs-on: ubuntu-latest # 最新のUbuntu環境を使用

    # ジョブのステップ
    steps:
      # 1. リポジトリのコードをチェックアウト
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Node.js環境のセットアップ
      # プロジェクトに必要なNode.jsのバージョンを指定します。
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' #
          cache: 'npm' 
          cache-dependency-path: front/package-lock.json

      # 3. 依存関係のインストール
      # CI/CD環境では、npm ci を使用することが推奨されます。
      # これは package-lock.json を基に正確な依存関係をインストールし、より信頼性の高いビルドを保証します。
      - name: Install Dependencies
        run: npm ci
        working-directory: ./front

      # 4. プロジェクトのビルド
      # package.jsonで定義されている 'build' スクリプトを実行します。
      - name: Run Build
        run: npm run build
        working-directory: ./front