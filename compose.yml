services:
  db:
    image: 'postgres:latest'
    container_name: 'formoku-db-local'
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_volume_formoku:/var/lib/postgresql/data
  db_proxy:
    image: ghcr.io/neondatabase/wsproxy:latest
    environment:
      APPEND_PORT: 'db:5432'
      ALLOW_ADDR_REGEX: '.*'
      LOG_TRAFFIC: 'true'
    ports:
      - '5433:80'
    depends_on:
      - db
  partykit:
    build:
      context: ./partykit
      dockerfile: Dockerfile
    container_name: 'partykit-local'
    ports:
      - '1999:1999'
  gyazo:
    build:
      context: ./localgyazo
      dockerfile: Dockerfile
    container_name: 'gyazo-local'
    ports:
      - '8888:80'
    environment:
      - GYAZO_API_TOKEN=sampletoken
    volumes:
      - gyazo_data_formoku:/var/www/html/data
      - gyazo_db_formoku:/var/www/html/db

volumes:
  postgres_volume_formoku:
  gyazo_data_formoku:
  gyazo_db_formoku:
